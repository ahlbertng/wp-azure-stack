name: ${COMPOSE_PROJECT_NAME:?set in .env}

services:

  wordpress:
    image: wordpress:php8.4-apache
    restart: always
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?set in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?set in .env}
      WORDPRESS_CONFIG_EXTRA: "define('WP_REDIS_HOST', '${WP_REDIS_HOST}');"

    volumes:
      - wp_data:/var/www/html
         # =========================================================================
      # MIGRATION ONLY: Overriding PHP limits to allow large imports.
      # You can safely delete or comment out the line below after migration.
      # =========================================================================
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
  wp_data:
